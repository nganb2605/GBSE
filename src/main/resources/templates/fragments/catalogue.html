<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Shared catalogue building blocks. This file is never rendered on its own.
-->

<!-- A folder with PDFs renders only product cards. Other folders are groups. -->
<div th:fragment="catnode(cat, depth)" class="catalogue-node"
     th:classappend="|catalogue-depth-${depth}|" th:id="|cat-${cat.slug}|"
     th:style="|--catalogue-indent:${depth * 24}px|">
  <details class="catalogue-group" th:if="${#lists.isEmpty(cat.visibleProducts)}">
    <summary><span th:text="${cat.name}">Group</span><span class="catalogue-chevron" aria-hidden="true"></span></summary>
    <div class="catalogue-children">
      <div class="product-grid" th:if="${!#lists.isEmpty(cat.visibleProductChildren)}">
        <th:block th:each="child : ${cat.visibleProductChildren}">
          <a class="prod-card" th:each="p : ${child.visibleProducts}"
             th:id="|cat-${child.slug}|" th:href="@{'/products/' + ${p.id}}" th:data-search="${p.name}">
            <div class="pimg"><img th:src="@{/images/placeholder.png}" alt="Product image placeholder" loading="lazy" decoding="async"></div>
            <div class="pbody"><h4 th:text="${p.name}">Product</h4></div>
          </a>
        </th:block>
      </div>
      <th:block th:each="child : ${cat.visibleGroupChildren}">
        <div th:replace="~{fragments/catalogue :: catnode(${child}, ${depth} + 1)}"></div>
      </th:block>
    </div>
  </details>
  <div class="product-grid" th:unless="${#lists.isEmpty(cat.visibleProducts)}">
    <a class="prod-card" th:each="p : ${cat.visibleProducts}"
       th:href="@{'/products/' + ${p.id}}" th:data-search="${p.name}">
      <div class="pimg"><img th:src="@{/images/placeholder.png}" alt="Product image placeholder" loading="lazy" decoding="async"></div>
      <div class="pbody"><h4 th:text="${p.name}">Product</h4></div>
    </a>
  </div>
</div>

</body>
</html>
