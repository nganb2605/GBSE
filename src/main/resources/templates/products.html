<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="~{fragments/layout :: head('Products | GBSE')}"></th:block>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": "/" },
    { "@type": "ListItem", "position": 2, "name": "Products", "item": "/products" }
  ]
}
</script>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main id="main">

<section class="crumb">
  <div class="container">
    <a href="/">Home</a><span class="sep">/</span>
    <span class="crumb-current" href="/products">Products</span>
  </div>
</section>

<section class="section-search">
  <div class="container">
    <p class="search-prompt">What are you looking for?</p>
    <div class="search-wrap">
      <span class="search-icon"></span>
      <input id="search" type="text" autocomplete="off" placeholder="Search products..."/>
      <div id="suggestions" class="suggestions"></div>
    </div>
  </div>
</section>

<section class="section-ranges">
  <div class="container">
    <div class="cat-layout">

      <!-- Sticky range index -->
      <nav class="cat-index" aria-label="Product ranges">
        <p class="cat-index-title">Ranges</p>
        <a th:each="r,it : ${roots}" th:href="|#range-${r.slug}|" class="cat-index-link" th:data-range="${r.slug}">
          <span class="n" th:text="${it.count}">1</span>
          <span th:text="${r.name}">Range</span>
        </a>
      </nav>

      <div class="range-list">
      <div class="range" th:each="r,it : ${roots}" th:id="|range-${r.slug}|">
        <div th:replace="~{fragments/catalogue :: catnode(${r}, 0)}"></div>
      </div>
      </div>

    </div>
  </div>
</section>

</main>
<script th:inline="javascript">
  const ALL = /*[[${allProducts}]]*/ [];
  const input = document.getElementById('search');
  const sug = document.getElementById('suggestions');

  function searchAll(q){
    q = (q||'').trim().toLowerCase();
    if(!q) return [];
    return ALL.filter(p => p.searchText.toLowerCase().includes(q)).slice(0,6);
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function renderSug(items){
    if(!items.length){ sug.classList.remove('open'); sug.innerHTML=''; return; }
    // All product data is inserted via esc() to prevent stored XSS.
    // Never use template literals with untrusted data directly in innerHTML.
    sug.innerHTML = items.map(p =>
      '<a href="/products/' + p.id + '">'
      + '<img src="/images/placeholder.png" alt="Product image placeholder"/>'
      + '<div class="sug-text">'
      + '<div class="name">' + esc(p.name) + '</div>'
      + '</div>'
      + '</a>'
    ).join('');
    sug.classList.add('open');
  }

  function filterCards(q){
    q = (q||'').trim().toLowerCase();
    document.querySelectorAll('.prod-card').forEach(c => {
      const t = c.dataset.search.toLowerCase();
      c.style.display = !q || t.includes(q) ? '' : 'none';
    });
    document.querySelectorAll('.catalogue-group').forEach(group => {
      if (q) group.open = Array.from(group.querySelectorAll('.prod-card'))
        .some(c => c.style.display !== 'none');
    });
  }

  input.addEventListener('input', e => { renderSug(searchAll(e.target.value)); filterCards(e.target.value); });
  input.addEventListener('focus', e => renderSug(searchAll(e.target.value)));
  input.addEventListener('blur', () => setTimeout(()=>sug.classList.remove('open'),150));
</script>
<script>
  // Open all ancestor groups for range and breadcrumb links.
  function revealCatalogueTarget(target) {
    if (!target) return;
    let parent = target.matches('.range')
      ? target.querySelector(':scope > .catalogue-node')
      : target.closest('.catalogue-node');
    while (parent) {
      const group = parent.querySelector(':scope > .catalogue-group');
      if (group) group.open = true;
      parent = parent.parentElement.closest('.catalogue-node');
    }
  }
  if (location.hash) {
    const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    revealCatalogueTarget(target);
    if (target) requestAnimationFrame(() => target.scrollIntoView());
  }
  document.querySelectorAll('.cat-index-link').forEach(function (link) {
    link.addEventListener('click', function (e) {
      var id = link.getAttribute('href').slice(1);
      var range = document.getElementById(id);
      if (!range) return;
      e.preventDefault();
      revealCatalogueTarget(range);
      range.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
</script>
<div th:replace="~{fragments/layout :: ticker-home}"></div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
